<template id="home">
  <section class="screen">
    <span class="smallcaps">Vista del comerciante</span>
    <h1 class="title">Hola, {{name}}.</h1>
    <p class="subtitle">¿Qué hacemos hoy?</p>
    <span class="badge">Cobros simulados · Sin dinero real</span>
    <button class="big-action primary-action" type="button" data-charge="voice"><span class="action-icon" aria-hidden="true">🎙</span><span><strong>Cobrar con voz</strong><small>Dicta o escribe lo que vendiste</small></span></button>
    <button class="big-action" type="button" data-charge="calculator"><span class="action-icon" aria-hidden="true">▦</span><span><strong>Calcular y cobrar</strong><small>Suma, multiplica y revisa la venta</small></span></button>
    <button class="big-action" type="button" data-to="history"><span class="action-icon" aria-hidden="true">◷</span><span><strong>Mis cobros</strong><small>Consulta tus operaciones de prueba</small></span></button>
    <button class="link-btn" type="button" data-action="logout">Cerrar sesión de demostración</button>
  </section>
</template>
